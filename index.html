<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraTone — Aesthetic Ringtone Studio</title>
  <style>
    :root {
      --bg: #0d0b14;
      --surface: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #c084fc;
      --accent-2: #f472b6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background: radial-gradient(circle at top left, #24133d, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      font-size: 1.75rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-bar {
      display: flex;
      gap: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      backdrop-filter: blur(12px);
    }

    .search-bar input {
      background: transparent;
      border: none;
      color: var(--text);
      outline: none;
      width: 240px;
    }

    .search-bar button {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none;
      color: #0d0b14;
      font-weight: 700;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      cursor: pointer;
    }

    .categories {
      max-width: 1100px;
      margin: 0 auto 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .cat-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.25s ease;
      backdrop-filter: blur(10px);
    }

    .cat-btn:hover, .cat-btn.active {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #0d0b14;
      font-weight: 700;
      border-color: transparent;
      transform: translateY(-2px);
    }

    .layout {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(14px);
      transition: 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover { transform: translateY(-4px); border-color: var(--accent); }

    .card img { width: 100%; height: 135px; object-fit: cover; }

    .card-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }

    .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.35rem; }

    .card-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }

    .select-btn {
      width: 100%;
      padding: 0.55rem;
      border-radius: 12px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .select-btn:hover { background: var(--accent); color: #0d0b14; }

    .studio-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 1.5rem;
      backdrop-filter: blur(16px);
      height: fit-content;
      position: sticky;
      top: 2rem;
    }

    .studio-panel h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }

    .player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      margin: 1rem 0;
    }

    .controls { display: flex; flex-direction: column; gap: 0.75rem; }

    .controls label { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; }

    .controls input {
      width: 100%;
      padding: 0.5rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
    }

    .primary-btn {
      margin-top: 0.75rem;
      width: 100%;
      padding: 0.75rem;
      border-radius: 14px;
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #0d0b14;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header>
    <div class="logo">AuraTone</div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search any song on YouTube..." />
      <button onclick="searchYouTube(document.getElementById('searchInput').value)">Search</button>
    </div>
  </header>

  <div class="categories" id="categoryBar">
    <button class="cat-btn active" onclick="selectCategory(this, 'Trending Pop Hits Music')">Pop Hits</button>
    <button class="cat-btn" onclick="selectCategory(this, 'Aesthetic Lofi Chill Beats')">Lo-Fi & Chill</button>
    <button class="cat-btn" onclick="selectCategory(this, 'Bollywood Romantic Instrumental')">Bollywood</button>
    <button class="cat-btn" onclick="selectCategory(this, 'K-Pop Aesthetic Instrumental')">K-Pop</button>
    <button class="cat-btn" onclick="selectCategory(this, 'Soft Piano Rain Ringtone')">Piano & Ambient</button>
    <button class="cat-btn" onclick="selectCategory(this, 'Phonk Synthwave Bass')">Synthwave</button>
  </div>

  <div class="layout">
    <div class="song-grid" id="songGrid"></div>

    <aside class="studio-panel">
      <h2 id="selectedTitle">Select a Track</h2>
      <p style="font-size: 0.85rem; color: var(--muted);">Pick a category or search YouTube, then set your 30-second ringtone loop.</p>

      <div class="player-box">
        <iframe id="ytPlayer" width="100%" height="100%" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>

      <div class="controls">
        <label>Start Time (seconds) <span id="startVal">30s</span></label>
        <input type="number" id="startSec" value="30" min="0" oninput="document.getElementById('startVal').innerText = this.value + 's'" />

        <label>Ringtone Length (seconds) <span id="durVal">30s</span></label>
        <input type="number" id="durSec" value="30" min="5" max="40" oninput="document.getElementById('durVal').innerText = this.value + 's'" />

        <button class="primary-btn" onclick="previewRingtone()">Preview Ringtone Hook</button>
      </div>
    </aside>
  </div>

  <script>
    const API_KEY = 'YOUR_YOUTUBE_API_KEY'; // Paste your YouTube Data API v3 key here
    let currentVideoId = '';

    // Sample fallback songs so the site works before adding an API key
    const demoSongs = [
      { id: 'jfKfPfyJRdk', title: 'lofi hip hop radio - beats to relax/study', channel: 'Lofi Girl', thumb: 'https://ytimg.com' },
      { id: '5qap5aO4i9A', title: 'Chill Synthwave & Aesthetic Beats', channel: 'Aura Sounds', thumb: 'https://ytimg.com' },
      { id: 'DWcJFNfaw9c', title: 'Midnight Rain & Soft Piano Melody', channel: 'Dreamscape', thumb: 'https://ytimg.com' }
    ];

    function renderSongs(songs) {
      const grid = document.getElementById('songGrid');
      grid.innerHTML = songs.map(song => `
        <div class="card">
          <img src="${song.thumb}" alt="${song.title}" />
          <div class="card-body">
            <div>
              <div class="card-title">${song.title}</div>
              <div class="card-sub">${song.channel}</div>
            </div>
            <button class="select-btn" onclick="loadTrack('${song.id}', '${song.title.replace(/'/g, "\\'")}')">Set as Ringtone</button>
          </div>
        </div>
      `).join('');
    }

    async function searchYouTube(query) {
      if (!query) return;
      if (API_KEY === 'YOUR_YOUTUBE_API_KEY') {
        renderSongs(demoSongs);
        return;
      }
      const url = `https://googleapis.com{encodeURIComponent(query)}&key=${API_KEY}`;
      const res = await fetch(url);
      const data = await res.json();
      const formatted = data.items.map(item => ({
        id: item.id.videoId,
        title: item.snippet.title,
        channel: item.snippet.channelTitle,
        thumb: item.snippet.thumbnails.high.url
      }));
      renderSongs(formatted);
    }

    function selectCategory(btn, query) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      searchYouTube(query);
    }

    function loadTrack(videoId, title) {
      currentVideoId = videoId;
      document.getElementById('selectedTitle').innerText = title;
      previewRingtone();
    }

    function previewRingtone() {
      if (!currentVideoId) return;
      const start = parseInt(document.getElementById('startSec').value) || 0;
      const dur = parseInt(document.getElementById('durSec').value) || 30;
      const end = start + dur;
      document.getElementById('ytPlayer').src = `https://youtube.com{currentVideoId}?autoplay=1&start=${start}&end=${end}`;
    }

    // Load initial tracks
    searchYouTube('Trending Pop Hits Music');
  </script>
</body>
</html>
